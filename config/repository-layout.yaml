# Repository layout contract.
#
# One declaration per component, addressed by a logical id. Everything that
# needs a path asks this file for it, so moving a file is a change here
# rather than an edit across twenty modules.
#
# Ids are stable. That is the point: a scope marker in a query, a group
# name in a report, or a reference from a test survives relocation
# untouched.
#
# `role` is what a component *is*, and it carries consequences. A
# `generated-artifact` is not hand-edited. A `third-party-reference` is
# never redistributed. A `test-fixture` is expected to be invalid on
# purpose and must not be loaded as if it were part of the ontology.
#
# A `generated-artifact` must name the `generator` that writes it, or
# declare itself `orphaned` with the reason. That field exists because
# the sentence above -- "not hand-edited" -- was false for three
# components at once: the tools that wrote them are not in this
# repository, so they cannot be regenerated, and they were in fact
# text-edited during the namespace migration because that was the only
# way to move them. The contract asserted a property nothing could
# deliver, which is precisely the defect docs/process/PROCESS.md opens
# with. Recording it does not fix it; it stops it being invisible.
#
# Adding a file to the repository without declaring it here is a test
# failure, in both directions: an undeclared file has no stated role, and
# a declared component whose path does not exist is a contract describing
# something that is not there.

version: 1

components:

  # ---- Authored ontology -------------------------------------------

  - id: ontology.apqc.ext
    path: APQC_ontology/apqc-ext.ttl
    role: ontology-module
    description: >-
      The shared extension module. Recurring local act genera live here
      once as the canonical source; slices mirror what they use rather
      than importing it.

  - id: ontology.apqc.catalog
    path: APQC_ontology/apqc-catalog.ttl
    role: ontology-module
    description: >-
      The APQC process classification catalog. Large and mostly
      mechanical; the index exists so nothing has to read it whole.

  - id: ontology.apqc.capabilities-roles
    path: APQC_ontology/capabilities_roles.ttl
    role: ontology-module
    description: Capability and role classes.

  - id: ontology.apqc.capabilities-wiring
    path: APQC_ontology/capabilities_wiring.ttl
    role: ontology-module
    description: >-
      The Phase-1 bridge wiring processes to required capabilities and
      roles, and capabilities to what they enable.

  - id: ontology.apqc.delivery-processes
    path: APQC_ontology/delivery_processes.ttl
    role: ontology-module
    description: Delivery process classes.

  - id: ontology.apqc.slices
    path: APQC_ontology/slices
    role: ontology-module-set
    description: >-
      Thirteen self-contained section slices. Each inlines the genera it
      uses rather than importing the extension module.

  # ---- Validation ---------------------------------------------------

  - id: validation.apqc-shapes
    path: APQC_ontology/apqc_shapes.ttl
    role: ontology-validation
    description: SHACL constraints over the APQC modules.

  - id: validation.capabilities-roles-shapes
    path: APQC_ontology/capabilities_roles_shapes.ttl
    role: ontology-validation
    description: SHACL constraints over the capability and role layer.

  - id: validation.wellformedness
    path: shapes/wellformedness_shapes.ttl
    role: ontology-validation
    description: >-
      Well-formedness of an authored term, whatever module it lives in.
      Outside APQC_ontology/ because it constrains everything this
      repository authors, including the ARO modules that do not exist
      yet. Its drift rules are SPARQL rather than sh:uniqueLang or
      sh:maxCount, because the first ignores untagged literals -- which
      is all 57 of the real conflicts -- and the second would reject a
      legitimate pair of labels in two languages.

  # ---- Deliberately invalid ------------------------------------------

  - id: fixture.apqc-bad-examples
    path: APQC_ontology/apqc_bad_examples.ttl
    role: test-fixture
    description: >-
      Graphs that are supposed to fail validation. Declared with its own
      role so nothing loads it as ontology and reports its defects as
      corpus defects -- which is exactly what would happen if it were
      simply another .ttl in the directory.

  - id: fixture.wellformedness-bad-examples
    path: shapes/wellformedness_bad_examples.ttl
    role: test-fixture
    description: >-
      Cases built to break wellformedness_shapes.ttl, with positive
      controls beside them -- including the multilingual label pair that
      sh:maxCount 1 would have rejected, so the false positive is a test
      rather than something somebody remembers.

  # ---- Generated ----------------------------------------------------

  - id: generated.reports
    path: APQC_ontology/reports
    role: generated-artifact
    orphaned: >-
      The tool that wrote these is not in this repository, so they cannot
      be regenerated and nothing here can check them. They are 18.9 MB of
      reasoner output and gate results carried over from an earlier tree:
      15 of the 17 gate reports name a module path
      (`ontology\slices\apqc_1_0.ttl`) that does not exist here, and all
      of them assert "D Reasoner: consistent; no unsatisfiable classes
      (ELK)" -- a result nothing in this repository can reproduce, because
      no reasoner of that kind is here. `matchability.json` describes an
      agent fleet of 12 that belongs to a different project entirely.

      They were text-edited during the namespace migration, which is the
      one thing a generated artifact must never need. Treat every number
      in them as unverified until a generator lands and rewrites them.
    description: >-
      Reasoner output and validation-gate results from an earlier tree.
      Superseded in practice by tools/ontology/validate.py, which is
      reproducible; kept because deleting somebody else's evidence is not
      a decision to take quietly.

  - id: generated.reference
    path: APQC_ontology/reference
    role: generated-artifact
    orphaned: >-
      One derived extract, apqc_1_1_1.ttl, whose generator is not here.
      Nothing states what it was derived from or how, so it cannot be
      rebuilt or checked against its source.
    description: Derived reference extracts from an earlier tree.

  - id: generated.corpus-index
    path: APQC_ontology/index/corpus_index.tsv
    role: generated-artifact
    generator: tool.build-index
    description: >-
      A greppable index of every class and individual across the slices
      and shared modules, so navigation costs a grep rather than a read.

  - id: docs.corpus-index-guide
    path: APQC_ontology/index/README.md
    role: documentation
    description: How to use the corpus index.

  # ---- Documentation -------------------------------------------------

  - id: docs.specification
    path: docs/aro-specification-graph-v0.5.2.md
    role: documentation
    description: >-
      The ARO specification and Specification Graph pipeline, with its
      own numbered decisions.

  - id: docs.process
    path: docs/process/PROCESS.md
    role: documentation
    description: >-
      How this repository is built. Carried over from BFO-Aligned
      ValueNet, where the method was worked out.

  - id: docs.readme
    path: README.md
    role: documentation
    description: The public front door.

  - id: docs.handoff
    path: docs/HANDOFF.md
    role: documentation
    description: >-
      What is actually in this repository, what is trustworthy, and what
      is not. Written for a team taking the work over, and dated at the
      commit it describes: it is a snapshot, and a snapshot that pretends
      otherwise is worse than none.

  - id: docs.handoff-plan
    path: docs/HANDOFF-PLAN.md
    role: documentation
    description: >-
      The sequence, where HANDOFF.md is the state: what happens next, in
      what order, and who owns it. Carries the debt register with an
      owner and an exit criterion against each item, so nothing is owed
      by nobody.

  - id: docs.development
    path: docs/DEVELOPMENT.md
    role: documentation
    description: >-
      How to set up, run the checks, add a module, and re-vendor the
      upstream. The conventions and the traps, separated from the
      reasoning behind them in PROCESS.md.

  - id: licence.project
    path: LICENSE
    role: project-licence
    description: >-
      The terms this repository is offered under. Read by the licensing
      tool rather than assumed: a classifier that hardcoded a licence
      would happily assert one the repository does not declare.

  # ---- Vendored upstream ontology ------------------------------------
  #
  # Redistributed, unlike docs/Reference, and the difference is the
  # licence rather than the convenience. BFO is CC BY 4.0 and CCO is
  # BSD-3-Clause; both permit redistribution with attribution, and
  # vendor/NOTICE.md is that attribution.
  #
  # A separate role from `ontology-module` on purpose. These files are not
  # authored here and must not be counted as this repository's ontology:
  # the corpus digest would move when an upstream pin changed, and the
  # licensing tool would report 660 third-party triples as project
  # content.

  - id: vendor.bfo
    path: vendor/bfo/bfo-core-aro-extract.ttl
    role: vendored-ontology
    generator: tool.vendor-upstream
    redistributable: true
    description: >-
      The BFO terms this repository names, plus their named ancestry.
      Generated from a pinned commit; the file header records which one.

  - id: vendor.cco
    path: vendor/cco/cco-aro-extract.ttl
    role: vendored-ontology
    generator: tool.vendor-upstream
    redistributable: true
    description: >-
      The CCO terms this repository names, plus their named ancestry.
      This is what gives "Capability must reach cco:ont00001379 via
      subClassOf+" a chain to walk. Without it 10 of 116 capability
      classes reached the anchor and the other 106 were reported as
      violations of the ontology.

  - id: docs.vendor-notice
    path: vendor/NOTICE.md
    role: documentation
    generator: tool.vendor-upstream
    description: >-
      Attribution for the vendored extracts, as both upstream licences
      require. Generated, because an attribution file is exactly the kind
      of document that is right when written and quietly wrong after the
      next source is added.

  - id: config.upstream-sources
    path: config/upstream-sources.yaml
    role: configuration
    description: >-
      The pins: url, commit, digest and licence for each upstream. The
      url names the commit, so the bytes it serves cannot change.

  - id: generated.upstream-extracts
    path: config/upstream-extracts.json
    role: generated-artifact
    generator: tool.vendor-upstream
    description: >-
      What was taken from each upstream and what was left behind,
      including the count of axioms dropped because their object was an
      anonymous class expression.

  - id: tool.build-index
    path: tools/ontology/build_index.py
    role: tool
    description: >-
      Writes the corpus index. Every `kind` is decided by walking
      rdfs:subClassOf to a BFO or CCO anchor, so this depends on the
      vendored extracts and refuses to run without them -- absent the
      upstream, every class would be indexed `other` and the result would
      look complete.

  - id: tool.vendor-upstream
    path: tools/ontology/vendor_upstream.py
    role: tool
    description: >-
      Fetches the pinned upstreams, extracts the referenced terms and
      their ancestry, and writes the extracts, the notice and the
      manifest. Verifies offline by default; rebuilding needs the network.

  # ---- Third-party reference material --------------------------------
  #
  # Consulted, cited, and never redistributed. These are declared so the
  # licensing tool can see them and refuse to treat them as publishable,
  # rather than leaving that to whoever remembers.

  - id: reference.third-party
    path: docs/Reference
    role: third-party-reference
    redistributable: false
    tracked: false
    description: >-
      Standards and handbooks used as sources. ISO/IEC/IEEE 29148 is a
      paid standard and is not ours to publish; the NASA material is US
      Government work but is still cited rather than claimed.

      `tracked: false` is the load-bearing part. These files live on disk
      because the work needs them and are absent from the index because
      publishing them is not ours to do. It was declared after the fact:
      the four PDFs were committed and served from a public URL while the
      README said they were not redistributed, and the history had to be
      rewritten. The declaration is what stops that being something
      somebody has to remember.

  # ---- Configuration and tooling --------------------------------------

  - id: config.layout
    path: config/repository-layout.yaml
    role: configuration
    description: This file.

  - id: config.licensing-adjudications
    path: config/licensing-adjudications.yaml
    role: configuration
    description: >-
      Owner rulings where recorded provenance and current authorship
      diverge. Each names the evidence it rests on.

  - id: tool.layout
    path: tools/layout.py
    role: tool
    description: >-
      Resolves component ids to paths. Standalone on purpose: in ValueNet
      the equivalent lived inside a package whose __init__ loaded an
      entire agent runtime, so asking where a file lived cost 44 module
      imports.

  - id: generated.validation-baseline
    path: config/validation-baseline.json
    role: generated-artifact
    generator: tool.validate
    description: >-
      The findings this repository is known to carry, per shape set. The
      gate requires reality to match it: more is a regression, fewer
      means re-record so the reduction shows up in a diff. Kept as an
      artifact rather than as numbers inside test assertions, because a
      team taking this over needs to see the debt without reading test
      code.

  - id: generated.corpus-digest
    path: config/corpus-digest.json
    role: generated-artifact
    generator: tool.corpus-digest
    description: >-
      Ground digest and blank-node fingerprint of the authored ontology.
      Two measures because one is not enough: blank nodes are renamed by
      every parse and cannot be digested directly, and an ontology can be
      rewritten substantially without a single named term changing.

  - id: tool.corpus-digest
    path: tools/ontology/corpus_digest.py
    role: tool
    description: Measures the corpus; scope comes from this contract.

  - id: tool.validate
    path: tools/ontology/validate.py
    role: tool
    description: >-
      Runs the SHACL shapes, and reports whether they could still fail.
      Distinguishes a violation from a shape set that could not be
      evaluated because the vocabulary it reasons over is absent.

  - id: tool.licensing
    path: tools/licensing/disposition.py
    role: tool
    description: >-
      Exactly one disposition per tracked file, derived from role and
      adjudication rather than from a list of filenames.

  # ---- Decision record ---------------------------------------------------

  - id: docs.decisions
    path: docs/decisions
    role: documentation
    description: >-
      The repo decision record: the architect's signed instruments and
      directions, recorded verbatim and dated. ARO v0.5.2 section 18 says
      the ratification instrument is recorded here; the Phase-1.5
      amendments of 2026-09-10 are its first entries.

  # ---- Phase 1.5 spike (SPIKE.md) ---------------------------------------
  #
  # One role for everything the spike produced, by the architect's act of
  # 2026-09-11 (docs/decisions/2026-09-10-phase-1.5-amendments.md, "F-11
  # resolved"): fixtures, queue, graph and closure files, rules,
  # measurements, report, regardless of format. Governed by SPIKE.md under
  # its precedence rule; non-graduating per Amendment 2 (iii): nothing here
  # is ontology and nothing here becomes the Phase-4 reference graph.
  #
  # The two FX-SEAM fixtures carry the same role but live under examples/,
  # their specified location (ARO v0.5.2 section 15; SPIKE.md section 6).
  # They graduate into the fixture corpus at Phase 5 (ARO section 16) and
  # are re-roled then; `test-fixture` cannot host them today because that
  # role means a Turtle graph the SHACL validator loads.

  - id: spike.artifacts
    path: spike
    role: spike-artifact
    description: >-
      The Phase-1.5 spike, whole: the report; the source register,
      fragments, L2 graph and L3 candidates; the layout rule and the
      projector with their self-tests; the ratification queue and the
      starvation log; the projections and the handoff to OPS; the inputs
      received from the operator. spike/report.md states what was and was
      not done.

  - id: fixture.fx-seam-a
    path: examples/fx-seam-a
    role: spike-artifact
    description: >-
      FX-SEAM-A (ARO 13): the founding-input seam divergence on the SRS
      slice's real seam, authored RED with green precondition guards in
      tests/test_fx_seam.py. Not Turtle, so not a `test-fixture`; graduates
      into the corpus at Phase 5.

  - id: fixture.fx-seam-b
    path: examples/fx-seam-b
    role: spike-artifact
    description: >-
      FX-SEAM-B (ARO 13): the built artifact against the projected seam,
      authored RED and left RED; green is the INT-2 composition milestone,
      which this repository cannot reach alone. Its projected tier is the
      real projection output.
