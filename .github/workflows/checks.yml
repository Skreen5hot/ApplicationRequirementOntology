# The checks that run on every push and pull request.
#
# Deliberately small to begin with. A workflow that runs everything from
# day one is a workflow whose failures nobody reads; this runs the
# contract, the licensing classification and the suite, and grows as the
# checks do.
#
# Actions are pinned to commit SHAs. A tag can be moved to a different
# commit; a commit cannot. Everything else in this repository pins
# exactly, and a supply chain is a strange place to make an exception.
#
# fetch-depth is 0 because history-dependent checks are expected to
# arrive -- comparing an artifact against the commit it describes needs
# more than the tip. It is cheap here and painful to discover missing.

name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Contract, licensing, tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install the pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip list

      - name: The layout contract describes the tree
        run: python tools/layout.py

      - name: Every tracked file has exactly one disposition
        run: python tools/licensing/disposition.py

      - name: Nothing unpublishable is tracked
        run: python tools/licensing/disposition.py --check

      - name: Tests
        run: python -m pytest tests/ -q -p no:randomly
