# Pinned upstream ontologies, and what may be done with them.
#
# The shapes in this repository ask reachability questions -- "does this
# capability reach cco:ont00001379 via subClassOf+" -- and a question like
# that cannot be answered without the vocabulary it walks through. Before
# this file existed the validation ladder reported 213 violations that were
# entirely an artifact of BFO and CCO being absent, and those violations
# were indistinguishable from real defects.
#
# WHY EXTRACTS RATHER THAN owl:imports
#
# An owl:imports resolves over the network at validation time. That makes
# the result depend on when it ran and on what the far end served, which
# is the opposite of what a check is for. A pinned extract is part of the
# repository, identical on every machine, and reviewable.
#
# WHY PINNED TO A COMMIT RATHER THAN A TAG
#
# A tag can be moved to a different commit. The raw URLs below name the
# commit, so the bytes they serve cannot change; `sha256` records what
# those bytes were, so a proxy or a cache that serves something else is a
# refusal rather than a silent substitution.
#
# LICENSING
#
# Both upstreams may be redistributed with attribution, which is what
# makes vendoring legitimate here -- unlike the ISO standard in
# docs/Reference, which may not and is `tracked: false` for that reason.
# `licence_statement_contains` is checked against what the source file
# itself says in its dcterms:license, so the SPDX identifier below is
# verified against the artifact rather than asserted by whoever wrote
# this file.

